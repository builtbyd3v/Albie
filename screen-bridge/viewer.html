<!doctype html>
<!-- Test viewer for stream.py. Open the file directly, or add ?host=<laptop-ip> from another device.
     Styled like the Forge workspace: the stream fills the page with a stats pill on top. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen stream test</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b0c0f;
    color: rgba(255, 255, 255, 0.88);
    font: 500 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stats {
    position: fixed;
    top: 16px;
    left: 16px;
    height: 28px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    border-radius: 14px;
    background: rgba(18, 20, 25, 0.78);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 8px 24px -8px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
  }
  img { display: block; width: 100%; }
</style>
<body>
<div id="stats">connecting...</div>
<img id="screen" alt="">
<script>
  const host = new URLSearchParams(location.search).get("host") || "localhost";
  const ws = new WebSocket(`ws://${host}:8765`);
  const img = document.getElementById("screen");
  const stats = document.getElementById("stats");
  let frames = 0, bytes = 0;

  ws.onmessage = ({ data }) => {
    frames++;
    bytes += data.size;
    URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(data);
  };
  ws.onclose = () => (stats.textContent = "disconnected");

  setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) return;
    stats.textContent = `${frames} fps, ${Math.round(bytes / 1024)} KB/s`;
    frames = bytes = 0;
  }, 1000);
</script>
