<!doctype html>
<!-- A page for Albie to restyle by voice ("make the launch button orange", "add a countdown"). Open it in a browser. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Control</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e8eaf0; font: 16px system-ui, sans-serif; }
  .card { width: min(420px, 90vw); padding: 28px; border-radius: 16px; background: #1a1d24; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 20px; color: #9aa0ad; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #3b82f6; color: white; font: 600 16px system-ui, sans-serif; cursor: pointer; }
</style>
<div class="card">
  <h1>Launch Control</h1>
  <p>Rocket v1 is on the pad.</p>
  <button>Launch</button>
</div>
